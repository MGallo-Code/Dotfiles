name: CI

# coding-mastermind enforcers for dotfiles. All three jobs are authoritative
# backstops to the pre-commit hook (which is skippable with --no-verify).
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # INV-1: no live credentials in the tracked tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-no-secrets (full tree)
        run: python scripts/ci/check-no-secrets.py

  agents-identical:
    # The cross-tool constitution must not drift: AGENTS.md == CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md == CLAUDE.md
        run: |
          if ! cmp -s AGENTS.md CLAUDE.md; then
            echo "AGENTS.md and CLAUDE.md differ - run 'cp CLAUDE.md AGENTS.md'"; exit 1
          fi
          echo "AGENTS.md == CLAUDE.md OK"

  parity:
    # INV-2: the bash and powershell sides stay at feature parity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-parity
        run: python scripts/ci/check-parity.py

  hub-wiring:
    # INV-4 (no inlined hub bearer) + INV-5 (every hub wired per-role via the shared fn).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-hub-wiring
        run: python scripts/ci/check-hub-wiring.py

  skill-targets:
    # Generated skills have a live source; an archived root never leaks into an active list.
    # CI runs the manifest mode only (the --machine dangling-link scan needs the generated
    # skill dirs, which exist on a dev machine / during sync, not on a bare runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-skill-targets
        run: python scripts/ci/check-skill-targets.py

  agent-integrations:
    # Completion notifications stay explicit, per-session, cross-agent, and idempotent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-agent-integrations
        run: python scripts/ci/check-agent-integrations.py
      - name: check-agent-integrations revert-test (INV-16)
        run: python scripts/ci/check-agent-integrations.py --revert-test

  agent-config:
    # claude-config moved here from EA (ADR-0006), with its enforcers: INV-17 (resume-card hooks
    # and the /wrap-only clear guard) and the INV-15 trigger (dotfiles' git hooks regenerate
    # Codex's AGENTS.md after a rule change).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-context-card (INV-17)
        run: python scripts/ci/check-context-card.py
      - name: check-context-card revert-test (INV-17)
        run: python scripts/ci/check-context-card.py --revert-test
      - name: check-agent-rules-hooks (INV-15 trigger)
        run: sh scripts/ci/check-agent-rules-hooks.sh
      - name: check-moved-links (ADR-0006 cutover)
        run: bash scripts/ci/check-moved-links.sh
      - name: check-moved-links revert-test
        run: bash scripts/ci/check-moved-links.sh --revert-test
      - name: check-code-root (INV-18, GalloGrid split)
        run: bash scripts/ci/check-code-root.sh
      - name: check-code-root revert-test
        run: bash scripts/ci/check-code-root.sh --revert-test
      - name: check-ui-nudge (INV-19)
        run: bash scripts/ci/check-ui-nudge.sh
      - name: check-ui-nudge revert-test
        run: bash scripts/ci/check-ui-nudge.sh --revert-test
      - name: check-sync-commit (INV-20)
        run: bash scripts/ci/check-sync-commit.sh
      - name: check-sync-commit revert-test
        run: bash scripts/ci/check-sync-commit.sh --revert-test

  agent-config-windows:
    # ADR-0006 cutover, PowerShell half: Update-MovedLinks repoints symlinks and junctions, live
    # or dangling, and the sync verify helpers read the result, on pwsh 7 and Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-moved-links PowerShell
        shell: pwsh
        run: ./scripts/ci/check-moved-links.ps1
      - name: check-moved-links PowerShell revert-test
        shell: pwsh
        run: ./scripts/ci/check-moved-links.ps1 -RevertTest
      - name: check-moved-links Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-moved-links.ps1
      - name: check-moved-links Windows PowerShell revert-test
        shell: powershell
        run: ./scripts/ci/check-moved-links.ps1 -RevertTest
      - name: check-sync-commit PowerShell
        shell: pwsh
        run: ./scripts/ci/check-sync-commit.ps1
      - name: check-sync-commit PowerShell revert-test
        shell: pwsh
        run: ./scripts/ci/check-sync-commit.ps1 -RevertTest
      - name: check-sync-commit Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-sync-commit.ps1
      - name: check-code-root PowerShell
        shell: pwsh
        run: ./scripts/ci/check-code-root.ps1
      - name: check-code-root PowerShell revert-test
        shell: pwsh
        run: ./scripts/ci/check-code-root.ps1 -RevertTest
      - name: check-code-root Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-code-root.ps1
      - name: check-ui-nudge PowerShell
        shell: pwsh
        run: ./scripts/ci/check-ui-nudge.ps1
      - name: check-ui-nudge PowerShell revert-test
        shell: pwsh
        run: ./scripts/ci/check-ui-nudge.ps1 -RevertTest
      - name: check-ui-nudge Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-ui-nudge.ps1

  bash-local-selfref:
    # INV-9: no `local`/`declare` references a variable assigned earlier in the SAME statement
    # (unbound under `set -u` - the class of bug that crashed sync mid-regen 2026-06-18).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-local-selfref
        run: python scripts/ci/check-local-selfref.py

  workspace-access:
    # INV-14: named launchers are cwd-safe, explicit, fail-loud, and privacy-diagnosable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Zsh behavior-test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: check-workspace-access and load-bearing revert-test
        run: python scripts/ci/check-workspace-access.py --revert-test

  workspace-access-windows:
    # INV-14 PowerShell half: execute the trusted-launch behavior on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-workspace-access PowerShell behavior
        shell: pwsh
        run: ./scripts/ci/check-workspace-access.ps1

  combined-rules:
    # INV-15: Codex/Gemini combined rule files regenerate from source, stay read-only, and a
    # differing copy is always backed up (never lost) before it is overwritten.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-combined-rules
        run: bash scripts/ci/check-combined-rules.sh

  combined-rules-windows:
    # INV-15 PowerShell half: the same contract through the real Regen-CombinedAgentRules.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-combined-rules PowerShell
        shell: pwsh
        run: ./scripts/ci/check-combined-rules.ps1
      - name: check-combined-rules Windows PowerShell
        shell: powershell
        run: ./scripts/ci/check-combined-rules.ps1

  auto-git-safety:
    # INV-12: auto-git never creates commits, never touches dirty work, and ships triggers dormant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-auto-git-safety
        run: bash scripts/ci/check-auto-git-safety.sh
      - name: check-auto-git-safety revert-test
        run: bash scripts/ci/check-auto-git-safety.sh --revert-test

  auto-git-safety-windows:
    # INV-12 PowerShell half: execute the behavioral matrix against auto-git.ps1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-auto-git-safety PowerShell
        shell: pwsh
        run: ./scripts/ci/check-auto-git-safety.ps1
      - name: check-auto-git-safety PowerShell revert-test
        shell: pwsh
        run: ./scripts/ci/check-auto-git-safety.ps1 -RevertTest
      - name: check-auto-git-safety Windows PowerShell
        shell: powershell
        env:
          AUTO_GIT_PSHOST: powershell.exe
        run: ./scripts/ci/check-auto-git-safety.ps1
      - name: check-auto-git-safety Windows PowerShell revert-test
        shell: powershell
        env:
          AUTO_GIT_PSHOST: powershell.exe
        run: ./scripts/ci/check-auto-git-safety.ps1 -RevertTest

  fresh-client-setup:
    # INV-10: a fresh/headless CLIENT wires to exit 0 AND a functional client (no set -e abort on an
    # EXPECTED non-zero; bearers exported; hubs wired http+${*_BEARER}, never stdio/literal). Hermetic:
    # a throwaway $HOME + stub agent CLIs whose `mcp remove` of an unregistered server returns rc1 (the
    # real abort trigger). Runs the real manifest.sh wiring fns the way setup.sh/sync.sh do. Exercises
    # both the pre-cutover (nexus stdio) and post-cutover (nexus http) wiring, plus the revert-test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: INV-10 fresh-client wiring (pre-cutover)
        run: bash scripts/ci/check-fresh-client-setup.sh
      - name: INV-10 fresh-client wiring (post-cutover sim)
        run: GATE_NEXUS_REMOTED=true bash scripts/ci/check-fresh-client-setup.sh
      - name: INV-10 revert-test (the guard is load-bearing)
        run: bash scripts/ci/check-fresh-client-setup.sh --revert-test

  hub-bootstrap-failclosed:
    # manifest.sh bootstrap_all_hubs host-side FAIL-CLOSED contract (the F01 cross-check surface; the
    # INV-10 client gate never exercises it): a nexus bootstrap failure is FATAL (rc=1 -> setup.sh --host
    # aborts), courier/calendar failures warn-only, a malformed/non-object registry fails closed, and the
    # NEXUS_REMOTED staging gate skips nexus pre-cutover. Hermetic (stub bootstrap + fixture registries).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hub-bootstrap fail-closed gate
        run: bash scripts/ci/check-hub-bootstrap-failclosed.sh
      - name: hub-bootstrap revert-test (the fail-closed gate is load-bearing)
        run: bash scripts/ci/check-hub-bootstrap-failclosed.sh --revert-test

  docgen:
    # ADR-0007: docgen lives in tools/docgen and runs on every machine. Full suite, the slow
    # Chromium PDF tests included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: "tools/docgen/uv.lock"
      - name: docgen deps and Chromium
        working-directory: tools/docgen
        run: |
          uv sync --frozen
          uv run --no-sync playwright install --with-deps chromium
      - name: docgen (pytest, slow included)
        working-directory: tools/docgen
        run: uv run --no-sync python -m pytest -q --slow

  docgen-windows:
    # The PC runs docgen locally too: the fast suite (paths, DOCX) on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: "tools/docgen/uv.lock"
      - name: docgen (pytest, fast)
        working-directory: tools/docgen
        run: uv run --frozen python -m pytest -q
