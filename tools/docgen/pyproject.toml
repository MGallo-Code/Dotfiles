[project]
name = "docgen"
version = "0.1.0"
description = "MCP server that generates DOCX and PDF files (sibling of Nexus)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "playwright>=1.49",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "pypdf>=5.1",
    "pillow>=10.3",
    "markdown>=3.6",
]

[project.scripts]
docgen-server = "docgen.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: PDF/Playwright tests; opt in with --slow",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
